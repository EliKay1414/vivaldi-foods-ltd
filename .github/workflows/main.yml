name: Deploy Vivaldi to S3

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_APP_TITLE: ${{ secrets.VITE_APP_TITLE }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
      VITE_MEDIUM_FEED_URL: ${{ secrets.VITE_MEDIUM_FEED_URL }}
      VITE_GOOGLE_SITE_VERIFICATION: ${{ secrets.VITE_GOOGLE_SITE_VERIFICATION }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🟡 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🛠️ Build project
        run: bun run build

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 🪣 Deploy to S3
        run: |
          aws s3 sync dist s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete

      - name: 🔗 Publish HTML at SPA paths
        run: |
          BUCKET="${{ secrets.AWS_S3_BUCKET }}"
          for route in about products quality factory community-impact team services faq our-partners contact blog gallery; do
            file="dist/${route}/index.html"
            if [ -f "$file" ]; then
              aws s3 cp "$file" "s3://${BUCKET}/${route}" \
                --content-type "text/html; charset=utf-8" \
                --cache-control "public, max-age=300"
            fi
          done
